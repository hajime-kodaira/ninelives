name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Not go.mod's 1.22: that toolchain links Mach-O without LC_UUID,
          # which current macOS dyld refuses to run. go.mod still sets the
          # minimum language version.
          go-version: 'stable'
          cache: false # standard library only, so there is nothing to cache
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      # The tool is macOS-only in practice; this just guards the build.
      - run: GOOS=darwin GOARCH=arm64 go build ./...
